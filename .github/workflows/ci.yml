name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.x'}
      - run: go mod download
      - run: go mod tidy -diff
      - run: go test ./...
      - run: go vet ./...
